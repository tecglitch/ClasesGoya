<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>TaskFlow — mis tareas</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #17212b; background: #f2f5f8; }
      body { max-width: 760px; margin: 40px auto; padding: 0 18px 48px; }
      main, section { background: white; border: 1px solid #dce3ea; border-radius: 12px; padding: 20px; }
      input, select, button { box-sizing: border-box; padding: 10px 12px; margin: 5px 0; font: inherit; }
      input, select { border: 1px solid #b9c5d0; border-radius: 7px; }
      button { border: 0; border-radius: 7px; color: white; background: #175b8a; cursor: pointer; }
      button:disabled { opacity: .45; cursor: default; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .row input { flex: 1; min-width: 200px; }
      .error { color: #a32626; min-height: 1.4em; }
      .muted { color: #566574; }
      #tasks li { margin: 8px 0; padding: 10px; background: #f6f8fa; border-radius: 6px; }
      #app-box { display: none; }
      #presence { min-height: 1.4em; }
      h1 { margin-bottom: 6px; }
      @media (max-width: 520px) { body { margin-top: 18px; } main, section { padding: 14px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>TaskFlow</h1>
      <p class="muted">Tus proyectos y tareas, conectados a la API local.</p>

      <section id="login-box" aria-labelledby="login-title">
        <h2 id="login-title">Ingresar</h2>
        <form id="login-form">
          <div><label for="username">Usuario</label><br /><input id="username" autocomplete="username" required /></div>
          <div><label for="password">Contraseña</label><br /><input id="password" type="password" autocomplete="current-password" required /></div>
          <button type="submit">Ingresar</button>
        </form>
        <p id="login-error" class="error" role="alert"></p>
      </section>

      <section id="app-box" aria-labelledby="tasks-title">
        <div class="row">
          <h2 id="tasks-title">Mis tareas</h2>
          <button id="logout-button" type="button">Salir</button>
        </div>
        <p id="presence" class="muted" aria-live="polite">WebSocket desconectado</p>
        <ul id="tasks" aria-live="polite"></ul>
        <div class="row" aria-label="Paginación de tareas">
          <button id="previous-button" type="button" disabled>Anterior</button>
          <button id="next-button" type="button" disabled>Siguiente</button>
        </div>
        <hr />
        <label for="project">Proyecto</label><br />
        <select id="project"></select>
        <div class="row">
          <input id="new-title" maxlength="200" placeholder="Título de la nueva tarea" />
          <button id="create-button" type="button">Agregar tarea</button>
        </div>
        <p id="app-error" class="error" role="alert"></p>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
